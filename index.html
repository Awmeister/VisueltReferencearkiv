    const DB_NAME = 'DesignReferenceArchiveDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'references';

    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function loadAllStoredReferences() {
      try {
        const db = await initIndexedDB();
        return new Promise((resolve) => {
          const transaction = db.transaction(STORE_NAME, 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => resolve([]);
        });
      } catch (err) {
        console.error('IndexedDB load error:', err);
        return [];
      }
    }

    async function persistReferenceToDB(reference) {
      try {
        const db = await initIndexedDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(STORE_NAME, 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.put(reference);
          request.onsuccess = () => resolve();
          request.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB save error:', err);
      }
    }

    async function removeReferenceFromDB(id) {
      try {
        const db = await initIndexedDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(STORE_NAME, 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.delete(id);
          request.onsuccess = () => resolve();
          request.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB delete error:', err);
      }
    }

    function downloadPromptAsTxt(reference) {
      const content = `=====================================================
ARKIV // DESIGN REFERENCE & IMAGE PROMPT SPECIFICATION
=====================================================
ID:           ${reference.id}
TITEL:        ${reference.title}
FILNAVN:      ${reference.filename || 'Ikke angivet'}
KILDELINK:    ${reference.sourceUrl ? reference.sourceUrl : 'Ukendt kilde'}
DOMÆNE:       ${reference.domain || 'N/A'}
KATEGORI:     ${reference.primaryCategory}
SEKUNDÆRE:    ${(reference.secondaryCategories || []).join(', ') || 'Ingen'}
ASPECT RATIO: ${reference.aspectRatio || '16:9'}
DATO:         ${reference.dateAdded || new Date().toISOString().split('T')[0]}

-----------------------------------------------------
VISUEL TESE:
-----------------------------------------------------
${reference.oneLineThesis}

-----------------------------------------------------
DESIGN BRIEF & VISUEL LOGIK:
-----------------------------------------------------
${reference.designBrief}

-----------------------------------------------------
VISUAL RECIPE:
-----------------------------------------------------
• Typografi:   ${reference.visualRecipe?.typography || 'N/A'}
• Farvepalette: ${(reference.visualRecipe?.colorPalette || []).join(' | ') || 'N/A'}
• Komposition:  ${reference.visualRecipe?.composition || 'N/A'}
• Tekstur:     ${reference.visualRecipe?.textureContrast || 'N/A'}
• Bevægelse:   ${reference.visualRecipe?.motionInteraction || 'N/A'}
• Anvendelse:  ${reference.visualRecipe?.bestSuitedFor || 'N/A'}

-----------------------------------------------------
IMAGE GENERATION PROMPT:
-----------------------------------------------------
${reference.imagePrompt}

-----------------------------------------------------
UNDGÅ / NEGATIVE PROMPT:
-----------------------------------------------------
${reference.avoidPrompt || 'Undgå tekst, logoer, typografi, UI-elementer og direkte kopiering af kildebrandet.'}
=====================================================`;

      const slug = reference.title
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'design-prompt';

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${slug}-image-prompt.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function copyToClipboard(text, onSuccess) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          if (onSuccess) onSuccess();
        }).catch(() => fallbackCopy(text, onSuccess));
      } else {
        fallbackCopy(text, onSuccess);
      }
    }

    function fallbackCopy(text, onSuccess) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        if (onSuccess) onSuccess();
      } catch (err) {
        console.error('Kopiering mislykkedes:', err);
      }
      document.body.removeChild(textarea);
    }

                <h3 className="font-mono text-xs uppercase tracking-wider font-semibold text-ink flex items-center gap-2">
                  <span className="w-1.5 h-1.5 bg-ink inline-block"></span>
                  Visual Recipe (Konkrete Principper)
                </h3>
                <div className="border border-paper-line bg-paper-50 divide-y divide-paper-line font-mono text-xs">
                  <div className="p-3">
                    <span className="text-ink-muted uppercase block text-[10px] mb-0.5">Typografi:</span>
                    <span className="font-sans text-xs text-ink font-medium">
                      {reference.visualRecipe?.typography || 'Sober sans-serif kombineret med redaktionelle accenter.'}
                    </span>
                  </div>
                  <div className="p-3">
                    <span className="text-ink-muted uppercase block text-[10px] mb-1">Farvepalette:</span>
                    <div className="flex flex-wrap gap-1.5 items-center">
                      {(reference.visualRecipe?.colorPalette || ['#141413', '#FAF7F2', '#A63828']).map((color, i) => (
                        <span key={i} className="px-2 py-0.5 bg-paper-100 border border-paper-line text-[11px] text-ink flex items-center gap-1.5">
                          <span
                            className="w-2.5 h-2.5 rounded-none border border-black/20"
                            style={{ backgroundColor: color.split(' ')[0] }}
                          />
                          {color}
                        </span>
                      ))}
                    </div>
                  </div>
                  <div className="p-3">
                    <span className="text-ink-muted uppercase block text-[10px] mb-0.5">Komposition & Layout:</span>
                    <span className="font-sans text-xs text-ink font-medium">
                      {reference.visualRecipe?.composition || 'Balanceret gitter med hierarkiske tyngdepunkter.'}
                    </span>
                  </div>
                  <div className="p-3">
                    <span className="text-ink-muted uppercase block text-[10px] mb-0.5">Tekstur & Kontrast:</span>
                    <span className="font-sans text-xs text-ink font-medium">
                      {reference.visualRecipe?.textureContrast || 'Mat papiragtig finish med kontrolleret kontrast.'}
                    </span>
                  </div>
                  <div className="p-3">
                    <span className="text-ink-muted uppercase block text-[10px] mb-0.5">Bevægelse & Interaktivitet:</span>
                    <span className="font-sans text-xs text-ink font-medium">
                      {reference.visualRecipe?.motionInteraction || 'Blød mikro-interaktion uden prangende 3D-effekter.'}
                    </span>
                  </div>
                  <div className="p-3">
                    <span className="text-ink-muted uppercase block text-[10px] mb-0.5">Optimal Anvendelse:</span>
                    <span className="font-sans text-xs text-ink font-medium">
                      {reference.visualRecipe?.bestSuitedFor || 'Digitale publikationer, arkiver og tekniske produkter.'}

              {/* Keywords Tag Cloud */}

                <div className="flex flex-wrap gap-1.5">
                  {(reference.keywords || []).map((kw, i) => (
                    <span key={i} className="font-mono text-xs px-2.5 py-1 bg-paper-200 border border-paper-line text-ink">

              {/* Image-Generation Prompt Studio (Ready to copy/download) */}

                <div className="flex items-center justify-between border-b border-ink-crisp pb-2">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-rust"></span>
                    <h3 className="font-mono text-xs uppercase tracking-wider font-semibold text-ink">
                      Image-Generation Prompt
                    </h3>
                  </div>
                  <span className="font-mono text-[10px] text-ink-muted uppercase">
                    FORMAT: {reference.aspectRatio || '16:9'}
                  </span>
                </div>

                <div className="bg-paper-100 p-4 border border-paper-line font-mono text-xs text-ink leading-relaxed select-all">
                  {reference.imagePrompt}

                <div className="text-[11px] font-mono text-rust bg-rust-light p-2.5 border border-rust/20">
                  <span className="font-bold">Undgå / Negative: </span>

                  >
                    <span>{copied ? '✓ Prompt Kopieret!' : 'Kopiér prompt'}</span>
                  </button>

                  <button
                    onClick={() => downloadPromptAsTxt(reference)}
                    className="font-mono text-xs uppercase px-4 py-2.5 bg-paper-100 border border-ink-crisp text-ink hover:bg-paper-300 transition-colors flex items-center gap-2"

    function AddReferenceModal({ isOpen, onClose, onSaveNewReference }) {
      const [formData, setFormData] = useState({
        title: '',
        sourceUrl: '',
        filename: '',
        primaryCategory: 'Print-Tech Paper',
        secondaryCategories: '',
        keywords: '',
        oneLineThesis: '',
        designBrief: '',
        imagePrompt: '',
        avoidPrompt: 'Undgå tekst, logoer, typografi, UI-elementer og direkte kopiering af kildebrandet.',
        aspectRatio: '16:9',
        imageSrc: null,
      });

      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [imagePreview, setImagePreview] = useState(null);
      const fileInputRef = useRef(null);

      if (!isOpen) return null;

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const base64Data = event.target.result;
          setImagePreview(base64Data);
          setFormData((prev) => ({
            ...prev,
            filename: file.name,
            imageSrc: base64Data,
            title: prev.title || file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ')
          }));
        };
        reader.readAsDataURL(file);
      };

      // Mocked abstraction ready for future live AI vision endpoint integration
      const handleTriggerAnalysisAbstraction = () => {
        if (!imagePreview) return;
        setIsAnalyzing(true);
        setTimeout(() => {
          setIsAnalyzing(false);
          setFormData((prev) => ({
            ...prev,
            keywords: prev.keywords || 'Isometrisk layout, Monokrom, Taktil tekstur, Typografisk hierarki',
            oneLineThesis: prev.oneLineThesis || 'Ekspressiv digital komposition med fokus på papirkvaliteter og dæmpet farvemætning.',
            designBrief: prev.designBrief || 'Dette uploadede værk benytter et kontrolleret modulært gitter med afmålte typografiske pauser. Kontrasten mellem baggrund og forgrundselementer skaber en rolig, katalogagtig læsbarhed. Værket kan med fordel anvendes til redaktionelle portaler og arkitektoniske præsentationer.',
            imagePrompt: prev.imagePrompt || 'A sophisticated editorial graphic composition inspired by tactile book design. Clean paper textures, delicate hairline borders, and balanced monochrome typography with warm terracotta accents.',
          }));
        }, 600);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title) return;

        let domain = 'Ukendt kilde';
        if (formData.sourceUrl) {
          try {
            domain = new URL(formData.sourceUrl).hostname;
          } catch {
            domain = formData.sourceUrl;
          }
        }

        const newRef = {
          id: `ref-user-${Date.now()}`,
          title: formData.title,
          filename: formData.filename || 'uploaded_image.png',
          sourceUrl: formData.sourceUrl || '',
          domain: domain,
          primaryCategory: formData.primaryCategory,
          secondaryCategories: formData.secondaryCategories
            ? formData.secondaryCategories.split(',').map((s) => s.trim()).filter(Boolean)
            : [],
          keywords: formData.keywords
            ? formData.keywords.split(',').map((s) => s.trim()).filter(Boolean)
            : ['Brugerupload', 'Mangler analyse'],
          oneLineThesis: formData.oneLineThesis || 'Brugerdefineret visuel reference.',
          designBrief: formData.designBrief || 'Endnu ikke beskrevet i detaljer. Rediger kortet for at tilføje fuld analyse.',
          visualRecipe: {
            typography: 'Afstemt med uploadet visuelt udtryk.',
            colorPalette: ['#141413', '#FAF7F2', '#A63828'],
            composition: 'Asymmetrisk eller modulært grid.',
            textureContrast: 'Tekstur udledt fra kildebillede.',
            motionInteraction: 'Subtil interaktion.',
            bestSuitedFor: 'Webdesign og konceptudvikling.'
          },
          imagePrompt: formData.imagePrompt || '',
          avoidPrompt: formData.avoidPrompt || 'Undgå tekst, logoer og direkte kopiering.',
          aspectRatio: formData.aspectRatio || '16:9',
          dateAdded: new Date().toISOString().split('T')[0],
          imageSrc: formData.imageSrc || null,
        };

        onSaveNewReference(newRef);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-paper-100 border-2 border-ink-crisp w-full max-w-3xl my-8 p-6 shadow-2xl relative">
            <div className="flex items-center justify-between border-b border-ink-crisp pb-3 mb-6">
              <div>
                <span className="font-mono text-[10px] text-rust uppercase tracking-wider font-bold">Arkiv Import</span>
                <h2 className="font-serif text-2xl font-normal text-ink">Tilføj ny webdesign-reference</h2>
              </div>
              <button onClick={onClose} className="font-mono text-sm px-2 py-1 hover:bg-paper-200 border border-transparent hover:border-ink">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              {/* Image upload dropzone */}
              <div>
                <label className="block font-mono text-xs uppercase mb-1 font-semibold">1. Vælg Screenshot / Billedfil</label>
                <div
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="border-2 border-dashed border-paper-line hover:border-ink p-4 text-center cursor-pointer bg-paper-50 transition-colors"
                >
                  <input
                    type="file"
                    ref={fileInputRef}
                    accept="image/*"
                    onChange={handleImageUpload}
                    className="hidden"
                  />
                  {imagePreview ? (
                    <div className="flex flex-col items-center gap-2">
                      <img src={imagePreview} alt="Upload preview" className="max-h-44 object-contain border border-paper-line" />
                      <span className="font-mono text-xs text-ink-muted">Klik for at udskifte fil ({formData.filename})</span>
                    </div>
                  ) : (
                    <div className="py-6 space-y-1">
                      <p className="font-mono text-xs text-ink font-semibold">Klik her for at vælge screenshot fra din computer</p>
                      <p className="font-mono text-[11px] text-ink-faint">PNG, JPG eller WebP understøttes. Gemmes lokalt i IndexedDB.</p>
                    </div>
                  )}
                </div>
              </div>

              {/* URL & Title */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-mono text-xs uppercase mb-1">Titel på Reference *</label>
                  <input
                    type="text"
                    required
                    value={formData.title}
                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                    placeholder="fx Stillpage Editorial"
                    className="w-full font-serif text-base p-2 bg-paper-50 border border-ink-crisp"
                  />
                </div>
                <div>
                  <label className="block font-mono text-xs uppercase mb-1">Oprindeligt Kildelink (valgfrit)</label>
                  <input
                    type="url"
                    value={formData.sourceUrl}
                    onChange={(e) => setFormData({ ...formData, sourceUrl: e.target.value })}
                    placeholder="https://example.com"
                    className="w-full font-mono text-xs p-2.5 bg-paper-50 border border-ink-crisp"
                  />
                </div>
              </div>

              {/* Categories */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-mono text-xs uppercase mb-1">Primær Kategori</label>
                  <select
                    value={formData.primaryCategory}
                    onChange={(e) => setFormData({ ...formData, primaryCategory: e.target.value })}
                    className="w-full font-mono text-xs p-2.5 bg-paper-50 border border-ink-crisp"
                  >
                    {TAXONOMIC_CATEGORIES.filter((c) => c !== 'ALL').map((c) => (
                      <option key={c} value={c}>{c}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block font-mono text-xs uppercase mb-1">Visuelle Nøgleord (komma-adskilt)</label>
                  <input
                    type="text"
                    value={formData.keywords}
                    onChange={(e) => setFormData({ ...formData, keywords: e.target.value })}
                    placeholder="Minimal, Terrakotta, Isometrisk, Mono"
                    className="w-full font-mono text-xs p-2.5 bg-paper-50 border border-ink-crisp"
                  />
                </div>
              </div>

              {/* AI helper button abstraction */}
              {imagePreview && (
                <div className="p-3 bg-paper-200 border border-paper-line flex items-center justify-between">
                  <span className="font-mono text-xs text-ink">
                    Mangler du metadata for dette billede?
                  </span>
                  <button
                    type="button"
                    onClick={handleTriggerAnalysisAbstraction}
                    disabled={isAnalyzing}
                    className="font-mono text-xs uppercase px-3 py-1.5 bg-paper-100 border border-ink-crisp hover:bg-ink hover:text-white"
                  >
                    {isAnalyzing ? 'Uddrager mønstre...' : 'Foreslå metadata (Kladde)'}
                  </button>
                </div>
              )}

              {/* Brief & Prompt */}
              <div>
                <label className="block font-mono text-xs uppercase mb-1">Visuel Tese (1 linje)</label>
                <input
                  type="text"
                  value={formData.oneLineThesis}
                  onChange={(e) => setFormData({ ...formData, oneLineThesis: e.target.value })}
                  placeholder="En kortfattet sætning om sidens centrale visuelle princip..."
                  className="w-full font-serif text-sm p-2 bg-paper-50 border border-ink-crisp"
                />
              </div>

              <div>
                <label className="block font-mono text-xs uppercase mb-1">Designbrief (100–160 ord)</label>
                <textarea
                  rows={3}
                  value={formData.designBrief}
                  onChange={(e) => setFormData({ ...formData, designBrief: e.target.value })}
                  placeholder="Forklar typografi, farver, komposition, kontrast, layout og passende produkter..."
                  className="w-full font-sans text-xs p-2 bg-paper-50 border border-ink-crisp leading-relaxed"
                />
              </div>

              <div>
                <label className="block font-mono text-xs uppercase mb-1">Billedprompt til ny hero/grafik</label>
                <textarea
                  rows={2}
                  value={formData.imagePrompt}
                  onChange={(e) => setFormData({ ...formData, imagePrompt: e.target.value })}
                  placeholder="A high-contrast editorial concept..."
                  className="w-full font-mono text-xs p-2 bg-paper-50 border border-ink-crisp"
                />
              </div>

              <div className="flex items-center justify-end gap-3 pt-3 border-t border-ink-crisp">
                <button
                  type="button"
                  onClick={onClose}
                  className="font-mono text-xs uppercase px-4 py-2 bg-paper-200 border border-ink-crisp text-ink hover:bg-paper-300"
                >
                  Annuller
                </button>
                <button
                  type="submit"
                  className="font-mono text-xs uppercase px-5 py-2.5 bg-ink text-white hover:bg-rust font-semibold"
                >
                  Gem reference i arkiv
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [references, setReferences] = useState(SEED_REFERENCES);
      const [selectedReferenceId, setSelectedReferenceId] = useState(null);
      const [activeCategory, setActiveCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isDbLoaded, setIsDbLoaded] = useState(false);

      // Initialize Icons on render
      useEffect(() => {
        if (window.lucide && window.lucide.createIcons) {
          window.lucide.createIcons();
        }
      });

      // Synchronize with Hash Routing (/#/reference/:id)
      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash;
          const match = hash.match(/^#\/reference\/(.+)$/);
          if (match && match[1]) {
            setSelectedReferenceId(match[1]);
          } else {
            setSelectedReferenceId(null);
          }
        };

        window.addEventListener('hashchange', handleHashChange);
        handleHashChange(); // Run on mount

        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      // Load persistent custom uploads from IndexedDB and merge with seed data
      useEffect(() => {
        async function fetchFromDB() {
          const stored = await loadAllStoredReferences();
          if (stored && stored.length > 0) {
            setReferences((prev) => {
              const map = new Map();
              prev.forEach((r) => map.set(r.id, r));
              stored.forEach((r) => map.set(r.id, r));
              return Array.from(map.values());
            });
          }
          setIsDbLoaded(true);
        }
        fetchFromDB();
      }, []);

      // Navigation helpers
      const navigateToDetail = (id) => {
        window.location.hash = `#/reference/${id}`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const navigateToOverview = () => {
        window.location.hash = '';
      };

      // Add & Update handlers
      const handleSaveNewReference = async (newRef) => {
        setReferences((prev) => [newRef, ...prev]);
        await persistReferenceToDB(newRef);
        navigateToDetail(newRef.id);
      };

      const handleUpdateReference = async (updatedRef) => {
        setReferences((prev) => prev.map((r) => (r.id === updatedRef.id ? updatedRef : r)));
        await persistReferenceToDB(updatedRef);
      };

      const handleDeleteReference = async (id) => {
        setReferences((prev) => prev.filter((r) => r.id !== id));
        await removeReferenceFromDB(id);
      };

      // Category counts calculation
      const categoryCounts = useMemo(() => {
        const counts = { ALL: references.length };
        TAXONOMIC_CATEGORIES.forEach((cat) => {
          if (cat !== 'ALL') {
            counts[cat] = references.filter((r) => r.primaryCategory === cat).length;
          }
        });
        return counts;
      }, [references]);

      // Filtered references
      const filteredReferences = useMemo(() => {
        return references.filter((ref) => {
          const matchesCat = activeCategory === 'ALL' || ref.primaryCategory === activeCategory;
          if (!matchesCat) return false;

          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          const matchTitle = ref.title.toLowerCase().includes(q);
          const matchThesis = (ref.oneLineThesis || '').toLowerCase().includes(q);
          const matchBrief = (ref.designBrief || '').toLowerCase().includes(q);
          const matchTags = (ref.keywords || []).some((kw) => kw.toLowerCase().includes(q));
          const matchDomain = (ref.domain || '').toLowerCase().includes(q);

          return matchTitle || matchThesis || matchBrief || matchTags || matchDomain;
        });
      }, [references, activeCategory, searchQuery]);

      // Selected reference object
      const activeReference = useMemo(() => {
        return references.find((r) => r.id === selectedReferenceId) || null;
      }, [references, selectedReferenceId]);

      // Render Detail View if URL hash is matching
      if (activeReference) {
        return (
          <DetailView
            reference={activeReference}
            allReferences={references}
            onBack={navigateToOverview}
            onNavigate={navigateToDetail}
            onUpdateReference={handleUpdateReference}
            onDeleteReference={handleDeleteReference}
          />
        );
      }

      // Overview page rendering
      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <Header
            totalCount={references.length}
            onOpenAddModal={() => setIsAddModalOpen(true)}
          />

          {/* Filter Chips & Search */}
          <CategoryFilters
            categories={TAXONOMIC_CATEGORIES}
            activeCategory={activeCategory}
            onSelectCategory={setActiveCategory}
            counts={categoryCounts}
            searchQuery={searchQuery}
            onSearchChange={setSearchQuery}
          />

          {/* Main Grid View */}
          <main className="flex-1 px-4 sm:px-8 py-8 max-w-7xl mx-auto w-full">
            {filteredReferences.length === 0 ? (
              <div className="border border-paper-line bg-paper-50 p-12 text-center my-12 space-y-3">
                <span className="font-mono text-xs text-rust uppercase tracking-wider font-semibold">Tom søgeresultat</span>
                <h3 className="font-serif text-2xl font-normal text-ink">Ingen referencer fundet</h3>
                <p className="font-sans text-xs text-ink-muted max-w-md mx-auto">
                  Der er ingen designreferencer, som matcher kategorien <span className="font-semibold text-ink">"{activeCategory}"</span> eller din søgetekst.
                </p>
                <button
                  onClick={() => { setActiveCategory('ALL'); setSearchQuery(''); }}
                  className="font-mono text-xs underline text-rust pt-2 hover:text-rust-hover"
                >
                  Nulstil alle filtre
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                {filteredReferences.map((ref, idx) => (
                  <ReferenceCard
                    key={ref.id}
                    reference={ref}
                    index={idx}
                    total={filteredReferences.length}
                    onSelect={navigateToDetail}
                  />
                ))}
              </div>
            )}
          </main>

          {/* Footer with curation credits */}
          <footer className="border-t border-ink-crisp bg-paper-200 px-4 sm:px-8 py-6 text-[11px] font-mono text-ink-muted">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <span>ARKIVSYSTEM © 2026 — DOKUMENTATION AF WEB- & PROMPTDATA</span>
              </div>
              <div className="flex items-center gap-4">
                <span>INDEXED_DB STATUS: {isDbLoaded ? 'AKTIV' : 'INITIALISERER'}</span>
                <span>•</span>
                <span className="text-rust">REDIGERING TILGÆNGELIG</span>
              </div>
            </div>
          </footer>

          {/* Add Reference Modal */}
          <AddReferenceModal
            isOpen={isAddModalOpen}
            onClose={() => setIsAddModalOpen(false)}
            onSaveNewReference={handleSaveNewReference}
          />
        </div>
      );
    }

    // Render the React application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
